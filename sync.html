<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sincronizar letra</title>
<style>
  body{margin:0;background:#080812;color:#fff;font:16px system-ui,sans-serif;padding:20px;max-width:640px;margin-inline:auto}
  h1{font-size:1.2rem;color:#ffb3d1} textarea{width:100%;height:160px;background:#14142a;color:#fff;border:1px solid #444;border-radius:8px;padding:8px;box-sizing:border-box}
  button{background:#ff6fa5;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:1rem;margin:6px 6px 6px 0;cursor:pointer}
  #now{font:700 1.4rem Georgia,serif;text-align:center;min-height:3.2em;margin:18px 0;color:#ffd6e7}
  #next{text-align:center;color:#ffffff88;min-height:1.4em} #time{text-align:center;color:#ffffff88}
  #out{white-space:pre-wrap;background:#14142a;border-radius:8px;padding:10px;font:13px monospace;max-height:260px;overflow:auto}
  small{color:#ffffff88}
</style>
</head>
<body>
<h1>Sincronizar letra con la canción</h1>
<small>1) La letra ya está cargada (puedes editarla). 2) Pulsa «Empezar». 3) Cada vez que la canción empiece a decir la línea que ves, toca el botón grande o la barra espaciadora. 4) Copia el resultado dentro de <code>LETRA</code> en <code>js/config.js</code>.</small>
<textarea id="txt" placeholder="Pega aquí la letra, una línea por renglón"></textarea>
<div><button id="go">Empezar</button><button id="back">↶ Deshacer</button></div>
<div id="time">0.0 s</div>
<div id="now">—</div>
<div id="next"></div>
<div style="text-align:center"><button id="tap" style="font-size:1.3rem;padding:18px 40px">¡Ahora!  (espacio)</button></div>
<p><b>Resultado</b> <button id="copy">Copiar</button></p>
<div id="out"></div>
<div id="yt" style="width:1px;height:1px;position:absolute;left:-9px"></div>

<script src="js/config.js"></script>
<script>
const $ = s => document.querySelector(s);
let audio = null, audioFailed = !CONFIG.AUDIO_LOCAL, player = null, ytReady = false;
if (CONFIG.AUDIO_LOCAL) {
  audio = new Audio(CONFIG.AUDIO_LOCAL);
  audio.addEventListener('error', () => { audioFailed = true; });
}
window.onYouTubeIframeAPIReady = () => { if (!CONFIG.VIDEO_MUSICA_ID) return; player = new YT.Player('yt', { width: 200, height: 120, videoId: CONFIG.VIDEO_MUSICA_ID,
  events: { onReady: () => ytReady = true } }); };
const now = () => (audio && !audioFailed) ? audio.currentTime : (ytReady ? player.getCurrentTime() : 0);

$("#txt").value = CONFIG.LETRA.map(l => typeof l === "string" ? l : l.texto).join("\n");
let lines = [], marks = [], i = 0, running = false;
function render(){
  $('#now').textContent = running ? (lines[i] || '✔ Terminaste') : '—';
  $('#next').textContent = running ? (lines[i + 1] || '') : '';
  const out = marks.map((t, k) => `    { t: ${t.toFixed(1)}, texto: ${JSON.stringify(lines[k])} },`).join('\n');
  $('#out').textContent = out;
}
$('#go').onclick = () => {
  lines = $('#txt').value.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return alert('Pega primero la letra.');
  marks = []; i = 0; running = true; render();
  if (audio && !audioFailed) { audio.currentTime = 0; audio.play(); } else if (ytReady) { player.seekTo(0); player.playVideo(); }
  else alert('No hay audio: pon tu mp3 en assets/musica/ayayay.mp3 (o abre esto con Live Server para usar YouTube).');
};
function tap(){ if (!running || i >= lines.length) return; marks.push(now()); i++; render(); }
$('#tap').onclick = tap;
$('#back').onclick = () => { if (i > 0) { i--; marks.pop(); render(); } };
addEventListener('keydown', e => { if (e.code === 'Space' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); tap(); } });
$('#copy').onclick = () => navigator.clipboard.writeText('  LETRA: [\n' + $('#out').textContent + '\n  ],');
setInterval(() => $('#time').textContent = now().toFixed(1) + ' s', 200);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
